<!doctype html>
<!--
  NOT THE BUILDER. The builder is frontend/index.html.

  This is a 3-line safety net. GitHub Pages' "Deploy from a branch" mode can only
  serve the repo root, so if Settings -> Pages -> Source has NOT been switched to
  "GitHub Actions" (see .github/workflows/pages.yml), the live URL would 404 after
  the 2026-07-25 reorg moved the builder into frontend/. This forwards it instead.

  Once Pages is switched to GitHub Actions, only frontend/ is published and this
  file is never served. It is also never published by Netlify (publish = "frontend").
  Safe to delete once Pages is on GitHub Actions.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDK Sites · KDK Software</title>
<link rel="icon" type="image/png" href="frontend/assets/ca-india-logo.png">
<meta http-equiv="refresh" content="0; url=frontend/">
<link rel="canonical" href="frontend/">
<body style="font-family:'Segoe UI',system-ui,sans-serif;background:#F0F4F8;color:#0D1E35;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center">
  <p>Loading the builder. <a href="frontend/" style="color:#C4830A">Continue to KDK Sites</a> if this does not redirect.</p>
  <script>location.replace('frontend/');</script>
</body>
