# Netlify config — must live at the repo root; Netlify reads it from nowhere else.
#
# Serves frontend/ as the site root (so /templates/<key>/index.html resolves the
# way render.ts expects) and runs the render Edge Function for published sites.

[build]
  publish = "frontend"
  command = ""
  # Edge functions moved under backend/ during the 2026-07-25 reorg.
  edge_functions = "backend/netlify/edge-functions"

# Published client sites.
#
# Registered on /* rather than /s/* because a real address (sharma.casites.in)
# requests "/", not "/s/...". render.ts inspects the Host header and returns
# undefined for anything it does not own, so the builder and all static assets
# pass straight through untouched.
#
# Adding a domain to the pool: point wildcard DNS (*.<domain>) at this site, add
# the domain in Netlify's Domain management, and append it to the SITE_DOMAINS
# env var. render.ts serves only domains named in SITE_DOMAINS.
[[edge_functions]]
  path = "/*"
  function = "render"
